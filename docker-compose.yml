services:

  postgres:
    image: pgvector/pgvector:pg16

    container_name: securerag-postgres

    environment:
      POSTGRES_USER: securerag
      POSTGRES_PASSWORD: securerag_password
      POSTGRES_DB: securerag

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: